# Cache : assets versionnés (?v=...) → 1 an immuable ; sinon 1 h ; HTML/JSON → revalidation
map $arg_v $asset_cache {
    ""      "public, max-age=3600";
    default "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Healthcheck Coolify
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location ~* \.(webp|png|jpg|svg|woff2|css|js)$ {
        add_header Cache-Control $asset_cache;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location ~* \.json$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}
