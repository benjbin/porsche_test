<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>SC 410 — Nuancier</title>
<meta name="description" content="SC 410 — le nuancier : teintes PANTONE unies et métallisées, en rendu sur la voiture.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/archivo-latin.woff2?v=t1" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/fragment-mono-latin.woff2?v=t1" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css?v=t1">
</head>
<body>

<main class="stage" id="stage" aria-label="Showroom : glissez pour changer de teinte">
  <div class="rig" id="rig">
    <img class="shot" id="shotNext" alt="" draggable="false">
    <div class="titles" aria-hidden="true"><div class="title" id="titleNext"></div></div>
    <div class="wipe" id="wipe"><img class="shot" id="shotCur" alt="" draggable="false" fetchpriority="high"></div>
    <div class="studio" aria-hidden="true"><i id="studioLight"></i></div>
    <div class="titles" aria-hidden="true"><div class="title" id="titleCur"></div></div>
    <div class="flash" aria-hidden="true"><i id="flashBand"></i></div>
  </div>
</main>

<div class="boot" id="boot" aria-live="polite"><span class="mono">Préparation du showroom…</span><i class="boot-line"></i></div>

<!-- Épreuve d'impression : filet de cadre + traits de coupe -->
<div class="frame" aria-hidden="true"></div>
<div class="crops" aria-hidden="true"></div>

<header class="top">
  <div class="mark"><span class="logo" role="img" aria-label="SC 410">SC <b>410</b></span></div>
  <span class="band mono" aria-hidden="true">Nuancier Pantone</span>
  <nav class="tools" aria-label="Nuancier">
    <button class="tool" id="tSearch" type="button" aria-haspopup="dialog" aria-controls="nuPanel" aria-label="Rechercher une teinte" title="Rechercher ( / )"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><span class="tl">Rechercher</span><kbd>/</kbd></button>
    <button class="tool" id="tFav" type="button" aria-haspopup="dialog" aria-controls="nuPanel" aria-label="Favoris (0)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span class="tn" id="tFavN">0</span></button>
    <button class="tool" id="tAll" type="button" aria-haspopup="dialog" aria-controls="nuPanel" aria-label="Ouvrir le nuancier" title="Nuancier (G)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg><span class="tl">Nuancier</span><kbd>G</kbd></button>
  </nav>
</header>

<section class="dock" id="dock" aria-label="Teinte affichée">
  <div class="dock-row">
    <div class="spec" id="spec">
      <div class="sp-n">
        <span class="ix mono" id="specN"><span aria-hidden="true">Nº</span> <span class="odo" id="specI" aria-hidden="true"></span></span>
        <i class="sp-rule" aria-hidden="true"></i>
        <button class="code mono" id="specCode" type="button" title="Copier la référence"></button>
      </div>
      <h1 class="sp-name" id="specName"><span class="l1" id="specL1"></span><span class="l2" id="specL2"></span></h1>
      <div class="sp-foot">
        <i class="sp-rule" aria-hidden="true"></i>
        <i class="bead" id="bead"></i>
      </div>
      <dl class="sp-row">
        <div><dt class="mono">Famille</dt><dd id="specFam"></dd></div>
        <div><dt class="mono">Finition</dt><dd id="specFinish"></dd></div>
      </dl>
      <span class="fampos" id="specFamPos"></span>
    </div>
    <div class="ctrls">
      <button class="act" id="fav" type="button" aria-pressed="false" aria-label="Ajouter aux favoris" title="Favori (F)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span class="al" id="favL">Favori</span></button>
      <div class="menu-wrap">
        <button class="act" id="btnExport" type="button" aria-label="Exporter ou partager" aria-controls="menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M5 14v6h14v-6"/></svg><span class="al">Exporter</span></button>
        <div class="menu" id="menu">
          <button type="button" data-fmt="story">Story <small>9:16</small></button>
          <button type="button" data-fmt="square">Carré <small>1:1</small></button>
          <button type="button" data-fmt="wide">Paysage <small>16:9</small></button>
          <button type="button" data-fmt="share">Partager le lien <small>URL</small></button>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- L'éventail : une lame par teinte autour d'un pivot sous le bord bas -->
<section class="fan" id="fan" aria-label="Éventail des teintes">
  <div class="fan-list" id="fanList" role="listbox" tabindex="0" aria-orientation="horizontal" aria-label="Éventail des teintes">
    <div class="fan-rot" id="fanRot"></div>
  </div>
  <i class="fan-gloss" aria-hidden="true"></i>
  <div class="fan-fams" id="fanFams"></div>
  <i class="fan-index" aria-hidden="true"></i>
  <div class="sr" id="fanLive" aria-live="polite"></div>
</section>
<p class="fan-hint mono" id="hint" aria-hidden="true"></p>
<div class="fan-card" id="fanCard" aria-hidden="true"><span class="fc-img lq"><img alt="" width="240" height="96" decoding="async"></span><span class="fc-txt"><b></b><span class="mono"></span></span></div>

<!-- Menu d'une lame (appui long, écrans tactiles) -->
<div class="menu lp-menu" id="lpMenu" role="menu" aria-label="Actions sur la teinte"></div>

<!-- Le Nuancier : toutes les teintes, recherche, favoris -->
<section class="panel nu" id="nuPanel" role="dialog" aria-modal="true" aria-labelledby="nuTitle">
  <div class="panel-head nu-head">
    <h2 id="nuTitle">Le Nuancier</h2>
    <button class="btn sq" id="closeNu" type="button" aria-label="Fermer le nuancier"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="nu-tools">
      <label class="nu-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
        <input id="q" type="search" placeholder="Référence, nom ou famille" autocomplete="off" spellcheck="false" enterkeyhint="go" aria-label="Rechercher une teinte : référence (7401), nom ou famille" aria-controls="nuBody"></label>
      <div class="nu-seg" role="group" aria-label="Filtre">
        <button type="button" id="segAll" aria-pressed="true">Toutes <span class="mono" id="segAllN"></span></button>
        <button type="button" id="segFav" aria-pressed="false">Favoris <span class="mono" id="segFavN">0</span></button>
      </div>
      <span class="nu-count mono" id="nuCount" aria-live="polite"></span>
      <button class="nu-share" id="shareSel" type="button" hidden>Partager la sélection</button>
    </div>
  </div>
  <div class="nu-body" id="nuBody"></div>
</section>

<!-- Face à face (retiré de l'interface : aucun point d'entrée, voir COMPARE dans app.js) : 2 à 4 finalistes, trois modes, quatre décors, loupe, repères -->
<section class="panel cmp" id="cmpPanel" role="dialog" aria-modal="true" aria-labelledby="cmpTitle" data-mode="cote" data-studio="gris">
  <div class="cx-head">
    <h2 id="cmpTitle">Face <em>à</em> face</h2>
    <div class="cx-bar">
      <div class="cx-seg" role="group" aria-label="Mode">
        <button type="button" data-m="rideau" aria-pressed="false" aria-keyshortcuts="1">Rideau</button>
        <button type="button" data-m="cote" aria-pressed="true" aria-keyshortcuts="2">Côte à côte</button>
        <button type="button" data-m="duel" aria-pressed="false" aria-keyshortcuts="3">Duel</button>
      </div>
      <div class="cx-seg" role="group" aria-label="Décor (S)">
        <button type="button" data-s="studio" aria-pressed="false"><i class="cx-sw"></i>Studio · fond teinté</button>
        <button type="button" data-s="gris" aria-pressed="true"><i class="cx-sw"></i>Gris neutre</button>
        <button type="button" data-s="jour" aria-pressed="false"><i class="cx-sw"></i>Plein jour</button>
        <button type="button" data-s="nuit" aria-pressed="false"><i class="cx-sw"></i>Nuit</button>
      </div>
      <button class="cx-chip" id="cxLoupe" type="button" aria-pressed="false" aria-keyshortcuts="L" title="Loupe (L, ou Maj maintenue)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>Loupe</button>
    </div>
    <button class="btn sq" id="closeCmp" type="button" aria-label="Fermer le face à face"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="cx-prog" id="cxProg" hidden><i></i></div>
  <div class="cx-view" id="cxView"></div>
  <div class="cx-foot">
    <ol class="cx-strip" id="cxStrip" aria-label="Finalistes"></ol>
    <p class="cx-cap mono" id="cxCap">Seul le décor change : la teinte reste celle du rendu</p>
  </div>
  <div class="cx-pop" id="cxPop" role="dialog" aria-label="Ajouter une finaliste" hidden>
    <label class="cx-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
      <input id="cxQ" type="search" role="combobox" aria-expanded="true" aria-controls="cxList" aria-autocomplete="list" placeholder="Référence, nom ou famille" autocomplete="off" spellcheck="false" aria-label="Chercher une teinte à ajouter"></label>
    <div class="cx-list" id="cxList" role="listbox" aria-label="Teintes"></div>
  </div>
  <p class="sr" id="cxLive" aria-live="polite"></p>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="app.js?v=t2"></script>
</body>
</html>
